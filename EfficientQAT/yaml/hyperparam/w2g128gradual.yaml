# basic quantization settings
wbits: 2
group_size: 128
method_name: w2g128

# extra training settings
# float, min_lr = lr/min_lr_factor
min_lr_factor: 20
clamp_method: STE
align_type: tail
# 验证crossblock的参数
crossblock_window_size: 1
slide_step: 1
# gradual quant参数
gradual_quant: True
# gradual_factor = gradual_quant_step / total_step
gradual_factor: 2.0
