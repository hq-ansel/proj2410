model:
  model_path: /home/ubuntu/data/exp/proj2410/model/Llama2-7b

data:
  train_path: /home/ubuntu/data/exp/proj2410/hf_home/rp_text_caches/data-00000-of-00001.arrow
  dataloader_type: native
  datasets_type: mapping
  data_type: plaintext
  max_seq_len: 4096
  text_keys: text
  drop_last: true

train:
  num_train_epochs: 2
  output_dir: /home/ubuntu/data/exp/proj2410/quant_model/Llama2-7B/EfficientQAT/test
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 2
  enable_activation_offload: true
  activation_gpu_limit: 40.0
  global_batch_size: 8
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.007
  dyn_bsz_margin: 0
  optimizer: adamw
  lr: 1.0e-5
  lr_warmup_ratio: 0.007
  lr_decay_style: constant
  lr_decay_ratio: 1.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: true
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 100
  save_hf_weights: true
  wandb_project: Meta-Llama-2-7B
  wandb_name: Meta-Llama-2-7B-int4-g128-uniform

quantizer:
  quant_type: uniform_affine
  n_bits: 4
  group_size: 128
  clamp_method: STE
  round_method: ste

  stat_quant: false
  
  iterative_freezing: false
  iterative_freezing_sheduler: linear
  
  # is_tracking 决定 freeze_momentum 和 freeze_threshold 是否生效
  is_tracking: false
  
  freeze_momentum: 0.004
  freeze_threshold: 0.0
  # 暂时未启用的选项
  interpolate: false
  
  lora_rank: 0
  decay_rate: 0.01
  shrinking_ratio: 0.5

profile:
  profile_module_name: []
