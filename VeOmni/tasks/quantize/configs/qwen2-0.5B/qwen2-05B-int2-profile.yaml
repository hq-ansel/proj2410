model:
  model_path: /home/ubuntu/data/exp/proj2410/model/Qwen2.5-0.5B

data:
  train_path: /home/ubuntu/Projects/Quantization/proj2410/hf_home/rp_text_caches/data-00000-of-00001.arrow
  dataloader_type: native
  datasets_type: mapping
  data_type: plaintext
  max_seq_len: 2048
  text_keys: text
  drop_last: true

train:
  num_train_epochs: 1
  max_steps: 20
  output_dir: /home/ubuntu/data/exp/proj2410/quant_model/Qwen2.5-0.5B/EfficientQAT/w2g64-int2-profile
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 2
  enable_activation_offload: false
  activation_gpu_limit: 40.0
  global_batch_size: 4
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  optimizer: adamw
  lr: 1.0e-5
  lr_warmup_ratio: 0.0
  lr_decay_style: constant
  lr_decay_ratio: 1.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: true
  enable_fsdp_offload: false
  num_to_forward_prefetch: 0
  num_to_backward_prefetch: 0
  init_device: meta
  enable_full_determinism: true
  debug: false
  empty_cache_steps: 1000
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 0
  save_hf_weights: false
  use_wandb: false
  
  # Profiling settings
  enable_profiling: true
  profile_start_step: 10
  profile_end_step: 15
  profile_trace_dir: ./trace_profile
  profile_record_shapes: true
  profile_profile_memory: true
  profile_with_stack: true

quantizer:
  quant_type: uniform_affine # gradual
  n_bits: 2
  group_size: 64
  clamp_method: STE
  round_method: ste
  quant_lr: 1e-5

  # Gradual quantization configuration
  enable_gradual_quant: true
  qat_warmup_steps: 0
  gradual_start_ratio: 1.0  # 立即全部量化
  gradual_end_ratio: 1.0
  priority_type: uniform

  stat_quant: false
  iterative_freezing: false
  iterative_freezing_sheduler: linear
  # is_tracking 决定 freeze_momentum 和 freeze_threshold 是否生效
  is_tracking: false
  freeze_momentum: 0.004
  freeze_threshold: 0.0
  # 暂时未启用的选项
  interpolate: false
  lora_rank: 0
  decay_rate: 0.01
  shrinking_ratio: 0.5
  quant_weight_decay: 0.0

profile:
  profile_module_name: ["model.layers.0"]
