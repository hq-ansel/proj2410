model:
  model_path: /home/ubuntu/data/exp/proj2410/model/Qwen2.5-0.5B

data:
  train_path: /home/ubuntu/data/exp/proj2410/hf_home/rp_text_caches/data-00000-of-00001.arrow
  dataloader_type: native
  datasets_type: mapping
  data_type: plaintext
  max_seq_len: 128
  train_size: 1024
  text_keys: text
  drop_last: true
  num_workers: 0

train:
  num_train_epochs: 1
  max_steps: 1
  output_dir: /home/ubuntu/data/exp/proj2410/quant_model/Qwen2.5-0.5B/EfficientQAT/w4g128-int4-dryrun
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  enable_activation_offload: false
  activation_gpu_limit: 40.0
  global_batch_size: 8
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  optimizer: adamw
  lr: 1.0e-5
  lr_warmup_ratio: 0.0
  lr_decay_style: constant
  lr_decay_ratio: 1.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: true
  enable_fsdp_offload: false
  num_to_forward_prefetch: 2
  num_to_backward_prefetch: 2
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 1
  save_epochs: 0
  save_hf_weights: true
  use_wandb: false
  wandb_project: Qwen2-0.5B
  wandb_name: Qwen2-0.5B-int4-g128-dryrun

quantizer:
  quant_type: uniform_affine
  n_bits: 4
  group_size: 64
  clamp_method: STE
  round_method: ste
