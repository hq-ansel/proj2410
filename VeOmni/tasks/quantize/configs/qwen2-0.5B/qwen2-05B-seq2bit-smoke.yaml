model:
  model_path: /home/ubuntu/data/exp/proj2410/model/Qwen2.5-0.5B

data:
  train_path: /home/ubuntu/Projects/Quantization/proj2410/hf_home/rp_text_caches/data-00000-of-00001.arrow
  dataloader_type: native
  datasets_type: mapping
  data_type: plaintext
  max_seq_len: 256
  train_size: 2048
  text_keys: text
  drop_last: true
  num_workers: 0

train:
  num_train_epochs: 1
  max_steps: 20
  output_dir: /home/ubuntu/data/exp/proj2410/quant_model/Qwen2.5-0.5B/EfficientQAT/seq2bit-smoke
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 1
  enable_activation_offload: false
  activation_gpu_limit: 40.0
  global_batch_size: 4
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: true
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  optimizer: adamw
  lr: 1.0e-5
  lr_warmup_ratio: 0.0
  lr_decay_style: constant
  lr_decay_ratio: 1.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: true
  enable_fsdp_offload: false
  num_to_forward_prefetch: 2
  num_to_backward_prefetch: 2
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 1
  save_epochs: 0
  save_hf_weights: true
  use_wandb: false
  wandb_project: Qwen2-0.5B
  wandb_name: Qwen2-0.5B-seq2bit-smoke

quantizer:
  quant_type: seq2bit
  n_bits: 2
  group_size: 64
  clamp_method: STE
  round_method: ste
  quant_lr: 1e-5
  quant_weight_decay: 0.0
  enable_infra: false
  enable_qweight_l2_reg: true
  qweight_l2_reg_lambda: 1e-6

  # seq2bit 作为独立量化器，不走 gradual 控制
  enable_gradual_quant: false
  qat_warmup_steps: 0
  gradual_start_ratio: 1.0
  gradual_end_ratio: 1.0
  priority_type: uniform

  stat_quant: false
  iterative_freezing: false
  iterative_freezing_sheduler: linear
  is_tracking: false
  freeze_momentum: 0.004
  freeze_threshold: 0.0
  interpolate: false
  lora_rank: 0
  decay_rate: 0.01
  shrinking_ratio: 0.5

profile:
  profile_module_name: ["model.layers.0"]
  forward_consistency_interval: 5
  forward_consistency_logit_metrics: ["mse", "cosine"]
  quant_stat_interval: 5
  quant_stat_module_name: ["gate_proj"]
  quant_stat_percentiles: [0.99, 0.999]
