model:
  model_path: /home/ubuntu/data/exp/proj2410/model/Qwen2.5-3B

data:
  train_path: /home/ubuntu/Projects/Quantization/proj2410/hf_home/rp_text_caches/data-00000-of-00001.arrow
  dataloader_type: native
  datasets_type: mapping
  data_type: plaintext
  max_seq_len: 1024
  text_keys: text
  drop_last: true

train:
  num_train_epochs: 1
  output_dir: /home/ubuntu/data/exp/proj2410/quant_model/Qwen2.5-3B/EfficientQAT/pact-int8-act
  data_parallel_mode: fsdp2
  ulysses_parallel_size: 4
  enable_activation_offload: true
  activation_gpu_limit: 40.0
  global_batch_size: 4
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.007
  dyn_bsz_margin: 0
  optimizer: adamw
  lr: 1.0e-5
  lr_warmup_ratio: 0.007
  lr_decay_style: constant
  lr_decay_ratio: 1.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: true
  enable_fsdp_offload: false
  num_to_forward_prefetch: 2
  num_to_backward_prefetch: 2
  enable_activation_offload: false
  init_device: meta
  enable_full_determinism: false
  debug: true
  empty_cache_steps: 500
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 1000
  save_hf_weights: true
  wandb_project: Qwen2-3B
  wandb_name: Qwen2-3B-pact-int8-act

quantizer:
  quant_type: uniform_affine
  n_bits: 8
  group_size: 64
  clamp_method: STE
  round_method: ste

  # PACT activation quantization
  enable_activation_quant: true
  activation_n_bits: 8
  activation_group_size: -1
  activation_clamp_method: STE

  stat_quant: false
  iterative_freezing: false
  is_tracking: false
  interpolate: false
  lora_rank: 0

distill:
  kd_mode: none
