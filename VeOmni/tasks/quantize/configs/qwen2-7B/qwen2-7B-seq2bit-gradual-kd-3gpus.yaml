  priority_type: sensitive_first

  stat_quant: false
  iterative_freezing: false
  iterative_freezing_sheduler: linear
  is_tracking: false
  freeze_momentum: 0.004
  freeze_threshold: 0.0
  interpolate: false
  lora_rank: 0
  decay_rate: 0.01
  shrinking_ratio: 0.5

distill:
  teacher_model: /home/ubuntu/data/exp/proj2410/model/Qwen2.5-7B
  kd_mode: logits
  kd_alpha: 0.5
